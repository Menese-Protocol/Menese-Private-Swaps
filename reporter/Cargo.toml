[package]
name = "swap-reporter"
version = "0.1.0"
edition = "2021"
publish = false
description = "Price reporter for the private swap canister's consensus feed"

[workspace]

[[bin]]
name = "swap-reporter"
path = "src/main.rs"

[dependencies]
ic-agent = "=0.49.1"
candid = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
num-traits = "0.2"
ring = "0.17"
futures = "0.3"
